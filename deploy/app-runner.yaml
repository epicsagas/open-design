# AWS App Runner config — https://docs.aws.amazon.com/apprunner/latest/dg/config-file-ref.html
# For source-based Docker builds from the repo.
# Pre-built image deployment uses the CLI directly (see install.sh cloud_deploy_apprunner).
#
# CLI (pre-built image):
#   aws apprunner create-service \
#     --service-name open-design \
#     --source-configuration "ImageRepository={ImageIdentifier=docker.io/vanjayak/open-design:latest,ImageRepositoryType=ECR_PUBLIC}" \
#     --port-configuration "Port=7456,Protocol=HTTP" \
#     --health-check-configuration "Protocol=HTTP,Path=/api/health,Interval=30,Timeout=5"
#
# Source-based (this file):
#   Connect GitHub repo in App Runner console → detects apprunner.yaml

version: 1.0
runtime: docker
build:
  dockerfile: Dockerfile
  context: .
run:
  env:
    - name: NODE_ENV
      value: production
    - name: OD_BIND_HOST
      value: "0.0.0.0"
    - name: OD_PORT
      value: "7456"
  network:
    port: 7456
    protocol: HTTP
  healthCheck:
    protocol: HTTP
    path: /api/health
    interval: 30
    timeout: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
