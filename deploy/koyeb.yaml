name: open-design

services:
  - name: open-design
    instance_type: nano
    regions:
      - fra
    image:
      image: docker.io/vanjayak/open-design:latest
      command: ""
    env:
      - key: NODE_ENV
        value: production
      - key: OD_BIND_HOST
        value: "0.0.0.0"
      - key: OD_PORT
        value: "7456"
      - key: OD_ALLOWED_ORIGINS
        value: ""
      - key: OD_API_TOKEN
        value: ""
    ports:
      - port: 7456
        protocol: http
    health_checks:
      - protocol: http
        port: 7456
        path: /api/health
        interval: 30s
        timeout: 5s
    volumes:
      - name: open-design-data
        mount_path: /app/.od
        size: "1GB"
