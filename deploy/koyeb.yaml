# Koyeb deployment reference — https://www.koyeb.com/docs/reference/services
# Koyeb does not use a YAML config file. Deploy via CLI or dashboard.
#
# CLI:
#   koyeb service create open-design \
#     --docker docker.io/vanjayak/open-design:latest \
#     --port 7456 \
#     --env NODE_ENV=production \
#     --env OD_BIND_HOST=0.0.0.0 \
#     --env OD_PORT=7456
#
# Dashboard:
#   1. https://app.koyeb.com/apps/create
#   2. Select "Docker Image"
#   3. Image: docker.io/vanjayak/open-design:latest
#   4. Expose port 7456 (HTTP)
#   5. Add environment variables:
#      - NODE_ENV=production
#      - OD_BIND_HOST=0.0.0.0
#      - OD_PORT=7456
#   6. Health check: HTTP GET /api/health on port 7456
#   7. Instance type: nano (or smallest available)
